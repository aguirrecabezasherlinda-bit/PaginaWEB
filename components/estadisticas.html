<section class="stats-section section-anchor" id="estadisticas" aria-labelledby="stats-title">
    <div class="section-container">
        <div class="stats-card" data-reveal>
            <div class="stats-intro">
                <p class="section-kicker section-kicker-light">Nuestra comunidad</p>
                <h2 id="stats-title">Crecemos con <span>cada estudiante</span></h2>
                <p>Una institución con raíces en Huanta y una mirada hacia el futuro.</p>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-icon" aria-hidden="true">♧</span>

                </div>
                <div class="stat-item">
                    <span class="stat-icon" aria-hidden="true">◉</span>
                    <strong data-counter="50" data-suffix="+">0</strong>
                    <span>Docentes especializados</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon" aria-hidden="true">▣</span>
                    <strong data-counter="5">0</strong>
                    <span>Programas de estudio</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon" aria-hidden="true">✦</span>
                    <strong data-counter="3">0</strong>
                    <span>Años para formar tu carrera</span>
                </div>
            </div>
        </div>
    </div>
</section>
